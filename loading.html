<style data-app-loading="inject-css">
  html {
    line-height: 1.15;
  }

  .loading {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #f4f7f9;
  }

  .loading.hidden {
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition: all 0.8s ease-out;
  }

  .dark .loading {
    background: #0d0d10;
  }

  .loading-logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
  }

  .loading-logo + .title {
    margin-top: 24px;
  }

  .title {
    margin-top: 66px;
    font-size: 28px;
    font-weight: 600;
    color: rgb(0 0 0 / 85%);
  }

  .dark .title {
    color: #fff;
  }

  .loader {
    position: relative;
    width: 48px;
    height: 48px;
  }

  .loader::before {
    position: absolute;
    top: 60px;
    left: 0;
    width: 48px;
    height: 5px;
    content: '';
    background: hsl(var(--primary, 210 100% 50%) / 50%);
    border-radius: 50%;
    animation: shadow-ani 0.5s linear infinite;
  }

  .loader::after {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    content: '';
    background: hsl(var(--primary, 210 100% 50%));
    border-radius: 4px;
    animation: jump-ani 0.5s linear infinite;
  }

  @keyframes jump-ani {
    15% {
      border-bottom-right-radius: 3px;
    }

    25% {
      transform: translateY(9px) rotate(22.5deg);
    }

    50% {
      border-bottom-right-radius: 40px;
      transform: translateY(18px) scale(1, 0.9) rotate(45deg);
    }

    75% {
      transform: translateY(9px) rotate(67.5deg);
    }

    100% {
      transform: translateY(0) rotate(90deg);
    }
  }

  @keyframes shadow-ani {
    0%,
    100% {
      transform: scale(1, 1);
    }

    50% {
      transform: scale(1.2, 1);
    }
  }
</style>
<div class="loading" id="__app-loading__">
  <div class="loader"></div>
  <div class="title" id="__app-loading-title__">
    <!-- 内联脚本在浏览器首次绘制前执行，零闪动。
         __site_config__ 每次获取（含空响应/失败）都会被覆盖写入；
         标题为空回退 %VITE_APP_TITLE%，图标为空时先用动态 Logo，再回退内置 /favicon.ico -->
    <script>
      (function () {
        var title;
        var config = null;
        try {
          var cached = localStorage.getItem('__site_config__');
          if (cached) config = JSON.parse(cached);
        } catch (e) {}
        if (config && config.title) title = config.title;
        var faviconLink = document.getElementById('__app-favicon__');
        if (faviconLink) {
          // 未配置 favicon 时沿用动态 Logo，两者都没有才用前端内置图标
          faviconLink.href =
            (config && (config.favicon || config.logo)) || '/favicon.ico';
        }
        if (!title) title = '%VITE_APP_TITLE%';
        // 同步设置浏览器标签标题：缓存里是上次拉取到的动态站点名称，
        // 避免首屏先显示 env 静态标题、等配置接口回来后再闪一下变成动态名称
        document.title = title;
        document.currentScript.parentNode.textContent = title;
      })();
    </script>
  </div>
</div>
